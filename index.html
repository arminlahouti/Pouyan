<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پویان | مسیریاب</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c2d3a; --sea:#0f6e7c; --route:#e8590c; --paper:#f4f8fa; --line:#d3e0e6; --muted:#5b7480;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:'Vazirmatn',Tahoma,sans-serif;color:var(--ink);background:var(--paper)}
  #map{position:absolute;inset:0}
  .top{position:absolute;z-index:1000;top:10px;right:10px;left:10px;display:flex;gap:8px;align-items:center}
  .brand{background:var(--ink);color:#fff;font-weight:800;padding:10px 16px;border-radius:12px;font-size:18px;white-space:nowrap}
  .search{flex:1;display:flex;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(12,45,58,.25);overflow:hidden}
  .search input{flex:1;border:0;padding:12px;font:inherit;font-size:15px;min-width:0;outline:none}
  .search button{border:0;background:var(--sea);color:#fff;font:inherit;padding:0 16px;cursor:pointer}
  .panel{position:absolute;z-index:1000;bottom:0;right:0;left:0;background:#fff;border-radius:18px 18px 0 0;
    box-shadow:0 -4px 18px rgba(12,45,58,.22);padding:14px 16px 16px;max-height:55vh;overflow:auto}
  @media(min-width:700px){.panel{width:380px;right:10px;left:auto;bottom:10px;border-radius:18px}}
  .hint{margin:0 0 10px;font-size:15px;color:var(--muted)}
  .sum{display:none;gap:18px;align-items:baseline;margin-bottom:10px}
  .sum b{font-size:26px;font-weight:800}
  .sum span{color:var(--muted);font-size:14px}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btns button{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;
    padding:10px;border-radius:10px;cursor:pointer;font-size:14px}
  .btns button.main{background:var(--sea);border-color:var(--sea);color:#fff}
  .btns button:focus-visible,.search button:focus-visible{outline:3px solid var(--route);outline-offset:2px}
  ol.steps{list-style:none;margin:12px 0 0;padding:0;display:none}
  ol.steps li{padding:8px 0;border-top:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:10px}
  ol.steps li span{color:var(--muted);white-space:nowrap}
  .pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
  .pin.a{background:var(--sea)} .pin.b{background:var(--route)}
  .err{color:#b42318}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="brand">پویان</div>
  <form class="search" id="searchForm">
    <input id="q" type="search" placeholder="جستجوی آدرس یا مکان" aria-label="جستجوی آدرس">
    <button type="submit">جستجو</button>
  </form>
</div>

<div class="panel">
  <p class="hint" id="hint">روی نقشه بزن یا آدرس جستجو کن تا مبدأ مشخص شود.</p>
  <div class="sum" id="sum"><b id="dist"></b><b id="time"></b><span>رانندگی</span></div>
  <div class="btns">
    <button class="main" id="locBtn" type="button">موقعیت من</button>
    <button id="resetBtn" type="button">پاک کردن مسیر</button>
  </div>
  <ol class="steps" id="steps"></ol>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map = L.map('map', {zoomControl:false}).setView([35.6892, 51.389], 11);
L.control.zoom({position:'topleft'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'© OpenStreetMap'
}).addTo(map);

const hint = document.getElementById('hint');
const sum = document.getElementById('sum');
const stepsEl = document.getElementById('steps');
let pts = [], markers = [], routeLine = null;

const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

function pin(cls){ return L.divIcon({className:'', html:'<div class="pin '+cls+'"></div>', iconSize:[26,26], iconAnchor:[4,26]}); }

function setHint(t, isErr){ hint.textContent = t; hint.className = 'hint' + (isErr ? ' err' : ''); }

function addPoint(ll){
  if(pts.length >= 2) resetAll();
  pts.push(ll);
  markers.push(L.marker(ll, {icon: pin(pts.length === 1 ? 'a' : 'b')}).addTo(map));
  if(pts.length === 1){ setHint('مبدأ ثبت شد. حالا مقصد را انتخاب کن.'); }
  else { setHint('در حال پیدا کردن مسیر...'); getRoute(); }
}

function resetAll(){
  pts = [];
  markers.forEach(m => map.removeLayer(m)); markers = [];
  if(routeLine){ map.removeLayer(routeLine); routeLine = null; }
  sum.style.display = 'none'; stepsEl.style.display = 'none'; stepsEl.innerHTML = '';
  setHint('روی نقشه بزن یا آدرس جستجو کن تا مبدأ مشخص شود.');
}

const turnFa = {
  'turn left':'به چپ بپیچید','turn right':'به راست بپیچید',
  'slight left':'کمی به چپ','slight right':'کمی به راست',
  'sharp left':'کاملاً به چپ','sharp right':'کاملاً به راست',
  'uturn':'دور بزنید','straight':'مستقیم بروید'
};
function stepText(s){
  const m = s.maneuver, name = s.name ? ' در ' + s.name : '';
  if(m.type === 'depart') return 'حرکت کنید' + name;
  if(m.type === 'arrive') return 'به مقصد رسیدید';
  if(m.type === 'roundabout' || m.type === 'rotary') return 'وارد میدان شوید' + name;
  const key = (m.modifier || 'straight');
  const base = turnFa[m.type === 'turn' ? 'turn ' + key.replace('slight ','').replace('sharp ','') : key] || turnFa[key] || 'ادامه دهید';
  return (turnFa[key] || base) + name;
}
function fmtDist(m){ return m >= 1000 ? fa((m/1000).toFixed(1)) + ' کیلومتر' : fa(Math.round(m)) + ' متر'; }
function fmtTime(s){
  const mins = Math.round(s/60);
  if(mins < 60) return fa(mins) + ' دقیقه';
  return fa(Math.floor(mins/60)) + ' ساعت و ' + fa(mins%60) + ' دقیقه';
}

async function getRoute(){
  const [a,b] = pts;
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&steps=true`;
  try{
    const r = await fetch(url);
    const d = await r.json();
    if(d.code !== 'Ok') throw new Error('no route');
    const route = d.routes[0];
    routeLine = L.geoJSON(route.geometry, {style:{color:'#e8590c', weight:6, opacity:.9}}).addTo(map);
    map.fitBounds(routeLine.getBounds(), {padding:[60,60]});
    document.getElementById('dist').textContent = fmtDist(route.distance);
    document.getElementById('time').textContent = fmtTime(route.duration);
    sum.style.display = 'flex';
    setHint('مسیر آماده است. برای مسیر جدید، دوباره روی نقشه بزن.');
    stepsEl.innerHTML = route.legs[0].steps.map(s =>
      `<li>${stepText(s)}<span>${fmtDist(s.distance)}</span></li>`).join('');
    stepsEl.style.display = 'block';
  }catch(e){
    setHint('مسیر پیدا نشد. اینترنت یا فیلترشکن را بررسی کن یا نقطه‌ی دیگری انتخاب کن.', true);
  }
}

map.on('click', e => addPoint(e.latlng));

document.getElementById('resetBtn').onclick = resetAll;

document.getElementById('locBtn').onclick = () => {
  if(!navigator.geolocation){ setHint('مرورگر شما موقعیت‌یابی را پشتیبانی نمی‌کند.', true); return; }
  setHint('در حال پیدا کردن موقعیت شما...');
  navigator.geolocation.getCurrentPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    if(pts.length >= 2) resetAll();
    if(pts.length === 0){ map.setView(ll, 15); addPoint(ll); }
    else { map.setView(ll, 15); addPoint(ll); }
  }, () => setHint('اجازه‌ی موقعیت داده نشد. در تنظیمات مرورگر اجازه را فعال کن.', true),
  {enableHighAccuracy:true, timeout:15000});
};

document.getElementById('searchForm').onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  setHint('در حال جستجو...');
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fa&q=' + encodeURIComponent(q));
    const d = await r.json();
    if(!d.length){ setHint('جایی با این نام پیدا نشد. عبارت دیگری امتحان کن.', true); return; }
    const ll = L.latLng(+d[0].lat, +d[0].lon);
    map.setView(ll, 15);
    addPoint(ll);
  }catch(err){
    setHint('جستجو انجام نشد. اینترنت یا فیلترشکن را بررسی کن.', true);
  }
};
</script>
</body>
</html>
